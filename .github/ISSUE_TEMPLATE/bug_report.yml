name: Bug report
description: Something in CrabbyCut doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! English or Vietnamese is fine (Tiếng Việt cũng được).
        Please search [existing issues](https://github.com/tamphamdesigner92-tb/CrabbyCut/issues) first.
  - type: input
    id: version
    attributes:
      label: CrabbyCut version
      placeholder: "e.g. 1.1.17"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run CrabbyCut?
      options:
        - Windows installer
        - From source on Windows
        - From source on macOS
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: OS version, GPU (if any), RAM
      placeholder: "e.g. Windows 11 23H2, RTX 3060, 16 GB"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project with ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, error messages or logs
      description: Drag images or files here. Please remove anything private from your footage or script.
